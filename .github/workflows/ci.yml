name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Kept in sync with the Node version pinned in web/Dockerfile.
  NODE_LTS_VERSION: '22'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Run linting
        # Pinned: an unpinned `pip install ruff` picks up whatever is newest at CI-run
        # time, and ruff's default rule set has changed between minor versions (0.16
        # added rules like import-sort and datetime-tzinfo checks that 0.15 didn't
        # enable by default) — that turned a routine PR into a 300+ finding pre-existing
        # lint backlog with no code change involved. Bump this deliberately, in its own
        # commit, when actually adopting a newer ruff's rule set.
        run: cd backend && pip install ruff==0.15.16 && ruff check app/
      - name: Run database migrations
        # Most tests override the DB dependency with an in-process fake and never touch
        # Postgres, but a handful (test_push_notifications.py, test_release_blockers.py)
        # import app.main and hit this service DB directly via AsyncSessionLocal — they
        # need the schema to already exist. Nothing else in this job creates it.
        run: cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xplatform_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-used-in-production-000000000000000000000000000000
      - name: Run tests
        run: cd backend && python -m pytest tests/ -x -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/xplatform_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-used-in-production-000000000000000000000000000000

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS_VERSION }}
      - name: Install
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      - name: Build
        run: cd web && npm run build

  mcp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS_VERSION }}
      - name: Install and test
        run: cd nexus-mcp && npm ci && npm test

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t nexus-backend:ci backend
      - name: Build web image
        run: docker build -f web/Dockerfile -t nexus-web:ci web
