services:
  postgres:
    # Digest-pinned; Dependabot refreshes it. See backend/Dockerfile for the rationale.
    image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Existing deployments created before the Nexus rename still hold their data in a
      # database literally named "xplatform". POSTGRES_DB only creates a database on an
      # empty data directory — it never renames one — so pointing an existing volume at a
      # new name would connect to a database that does not exist. Either run the one-time
      # rename in deploy/scripts/rename-legacy-database.sh, or pin POSTGRES_DB=xplatform
      # in your env file. See "Renaming a pre-Nexus database" in deploy/RUNBOOK.md.
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: nexus-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    environment:
      # These defaults are for the local production-like smoke stack only.
      # Real deployment values must be supplied explicitly through the deploy env file.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      APP_ENV: ${APP_ENV:-production}
      ENABLE_BOOTSTRAP_ADMIN: ${ENABLE_BOOTSTRAP_ADMIN:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Independent least-privilege credentials for /api/admin/service/*. Leave a scope
      # unset to deny it outright; there is no combined all-scopes token.
      SERVICE_TOKEN_READ: ${SERVICE_TOKEN_READ:-}
      SERVICE_TOKEN_NOTIFY: ${SERVICE_TOKEN_NOTIFY:-}
      SERVICE_TOKEN_DELETE: ${SERVICE_TOKEN_DELETE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      ENABLE_ADMIN_WEBAUTHN_RECOVERY: ${ENABLE_ADMIN_WEBAUTHN_RECOVERY:-false}
      ADMIN_WEBAUTHN_RECOVERY_IDENTIFIER: ${ADMIN_WEBAUTHN_RECOVERY_IDENTIFIER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://app.nexus.localtest.me:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api.nexus.localtest.me}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # redis: connects over this Compose stack's private internal network only (no
      # published port), so plaintext redis:// here is a deliberate, scoped exception —
      # not a general production allowance. "redis" is a Compose service hostname, not
      # an IP, so it must also be explicitly allowlisted rather than trusted just because
      # REDIS_ALLOW_PLAINTEXT_PRIVATE_NETWORK is set.
      REDIS_ALLOW_PLAINTEXT_PRIVATE_NETWORK: ${REDIS_ALLOW_PLAINTEXT_PRIVATE_NETWORK:-true}
      REDIS_PLAINTEXT_ALLOWED_HOSTS: ${REDIS_PLAINTEXT_ALLOWED_HOSTS:-redis}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-app.nexus.localtest.me}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Nexus}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://app.nexus.localtest.me:3000}
      UPLOADS_CACHE_CONTROL: ${UPLOADS_CACHE_CONTROL:-public, max-age=3600}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-capture}
      MAIL_CAPTURE_DIR: ${MAIL_CAPTURE_DIR:-tmp/mail}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Nexus}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://app.nexus.localtest.me:3000}
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/feedback_private_uploads:/app/feedback_private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "umask 077 &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': host}); urllib.request.urlopen(req)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Local-smoke default only; production must set the public API base URL explicitly.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.nexus.localtest.me:8000}
    container_name: nexus-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nexus-backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.nexus.localtest.me:8000}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + process.env.HOSTNAME + ':3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 8
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: nexus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Required, not defaulted. A default here meant an unconfigured production stack
      # silently asked Let's Encrypt for a certificate for a domain it does not own;
      # refusing to start is the better failure. The local stack supplies the
      # localtest.me hostnames via deploy/.env.docker (the local Caddyfile hardcodes
      # them anyway and ignores these values).
      APP_HOST: ${APP_HOST:?APP_HOST is required — the public hostname Caddy serves the web app on}
      API_HOST: ${API_HOST:?API_HOST is required — the public hostname Caddy serves the API on}
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 8

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
